name: Build study app candidates

on:
  workflow_dispatch:
    inputs:
      create_draft:
        description: 'Create an unpublished draft (run on the matching existing version tag)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/check-app.yml

  package:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            runner: windows-2022
            prototype: zip
          - id: linux-x64
            runner: ubuntu-22.04
            prototype: tar.gz
          - id: macos-x64
            runner: macos-15-intel
            prototype: zip
          - id: macos-arm64
            runner: macos-15
            prototype: zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.17'
          cache: pip
          cache-dependency-path: packaging/requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: app/dist
      - run: python -m pip install -r packaging/requirements.txt
      - name: Verify native toolchain and build folder prototype
        run: |
          python -c "import tkinter, platform; print(platform.platform(), tkinter.Tcl().eval('info patchlevel'))"
          python tools/package_study.py --mode onedir --output-dir dist/packages/prototype
      - name: Check folder prototype
        run: >-
          python tools/test_packaged_study.py
          --asset dist/packages/prototype/network-study-*-onedir.${{ matrix.prototype }}
          --metadata dist/packages/prototype/network-study-*-onedir.json
      - name: Build final download
        run: python tools/package_study.py
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-${{ matrix.id }}
          path: dist/packages/network-study-*
          if-no-files-found: error
          retention-days: 14

  test-packages:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            runner: windows-2022
            extension: exe
          - id: linux-x64
            runner: ubuntu-22.04
            extension: tar.gz
          - id: macos-x64
            runner: macos-15-intel
            extension: zip
          - id: macos-arm64
            runner: macos-15
            extension: zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.17'
      - uses: actions/setup-node@v7
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: app/dist
      - uses: actions/download-artifact@v8
        with:
          name: candidate-${{ matrix.id }}
          path: dist/packages
      - run: npm ci
        working-directory: app
      - name: Install test browser
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Test downloaded package (Linux virtual display)
        if: runner.os == 'Linux'
        run: >-
          xvfb-run -a python tools/test_packaged_study.py
          --asset dist/packages/network-study-*-${{ matrix.id }}.${{ matrix.extension }}
          --metadata dist/packages/network-study-*-${{ matrix.id }}.json
          --report dist/packages/check-${{ matrix.id }}.json --gui --browser
      - name: Test downloaded package (Windows/macOS)
        if: runner.os != 'Linux'
        run: >-
          python tools/test_packaged_study.py
          --asset dist/packages/network-study-*-${{ matrix.id }}.${{ matrix.extension }}
          --metadata dist/packages/network-study-*-${{ matrix.id }}.json
          --report dist/packages/check-${{ matrix.id }}.json --gui --browser
      - name: Retain package check result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-check-${{ matrix.id }}
          path: dist/packages/check-${{ matrix.id }}.json
          retention-days: 14
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-evidence-${{ matrix.id }}
          path: |
            app/test-results/
            app/playwright-report/
          retention-days: 14

  assemble:
    needs: test-packages
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.17'
      - uses: actions/download-artifact@v8
        with:
          pattern: candidate-*
          merge-multiple: true
          path: dist/packages
      - uses: actions/download-artifact@v8
        with:
          pattern: package-check-*
          merge-multiple: true
          path: dist/reports
      - name: Assemble verified candidate set
        run: python tools/assemble_study_release.py --packages dist/packages --reports dist/reports --output dist/packages/release
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: dist/packages/release/
          if-no-files-found: error
          retention-days: 30

  draft:
    if: inputs.create_draft
    needs: assemble
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.17'
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: dist/packages/release
      - name: Prepare unpublished draft on the existing matching tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'tools')
          from assemble_study_release import create_draft
          from package_study import read_json
          output = Path('dist/packages/release')
          package = read_json(output / 'BUILD_INFO.json')['packages'][0]
          create_draft(output, package['app_version'], package['commit'])
          PY
